<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стоматология</title>
<meta name="description" content="Стоматология: запись на приём, услуги и цены.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" hidden aria-hidden="true"><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>

<section class="hero" id="top">
  <header class="top">
    <a class="logo rise" href="#top" data-bind="name"></a>
    <nav class="nav rise" aria-label="Разделы">
      <a class="label" href="#services">Услуги</a>
      <a class="label" href="#clinic">Клиника</a>
      <a class="label" href="#book">Запись</a>
      <a class="label" href="#contacts">Контакты</a>
    </nav>
    <a class="btn btn--ghost rise" href="#book"><span class="btn__fill"></span><span class="btn__label" data-bind="cta"></span></a>
  </header>
  <div class="hero__object" data-parallax><img class="rise" src="assets/hero-mirror.png" alt="Стоматологическое зеркало на тёмном фоне" width="500" height="750"></div>
  <h1 class="hero__title"><span class="hero__l1 rise"></span><span class="hero__l2 rise"></span></h1>
  <div class="hero__foot">
    <p class="hero__sub rise" data-bind="sub"></p>
    <div class="hero__cta rise">
      <a class="btn btn--solid" href="#book"><span class="btn__fill"></span><span class="btn__label" data-bind="cta"></span><svg class="btn__arrow" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      <span class="note" data-bind="reassure"></span>
    </div>
  </div>
</section>

<section class="services reveal" id="services">
  <figure class="services__media"><img class="tone" src="assets/instruments.png" alt="Набор стоматологических инструментов" width="500" height="891"></figure>
  <div class="services__body">
    <h2 class="h2 rise" data-bind="servicesTitle"></h2>
    <ol class="list" id="list"></ol>
  </div>
</section>

<section class="clinic reveal" id="clinic">
  <div class="clinic__text">
    <h2 class="h2 rise" id="clinicTitle"></h2>
    <p class="rise" data-bind="clinicText"></p>
  </div>
  <div class="clinic__media">
    <img class="tone" src="assets/clinic-chair.png" alt="Стоматологический кабинет" width="500" height="334">
    <img class="tone" src="assets/clinic-white.png" alt="Светлый кабинет клиники" width="500" height="321">
  </div>
</section>

<section class="book reveal" id="book">
  <figure class="book__media"><img class="tone" src="assets/lounge.png" alt="Зона ожидания клиники" width="500" height="334"></figure>
  <div class="book__body">
    <h2 class="h2 rise" id="bookTitle"></h2>
    <form class="rise" id="form" name="booking" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="booking">
      <p hidden><label>Не заполнять <input name="bot-field"></label></p>
      <fieldset class="field pick"><legend class="label">Дата</legend><div class="chips" id="dates"></div></fieldset>
      <fieldset class="field pick"><legend class="label">Время</legend><div class="chips" id="times" aria-live="polite"></div></fieldset>
      <div class="field"><label class="label" for="f-name">Имя</label><input id="f-name" name="name" autocomplete="name" required></div>
      <div class="field"><label class="label" for="f-phone">Телефон</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required></div>
      <div class="field"><label class="label" for="f-service">Что беспокоит</label><select id="f-service" name="service"></select></div>
      <div class="hero__cta">
        <button class="btn btn--solid" type="submit"><span class="btn__fill"></span><span class="btn__label" data-bind="cta"></span><svg class="btn__arrow" aria-hidden="true"><use href="#i-arrow"/></svg></button>
        <span class="note" data-bind="reassure"></span>
      </div>
      <p class="form__status" id="status" role="status"></p>
    </form>
  </div>
</section>

<footer class="foot" id="contacts">
  <div><span class="label">Адрес</span><span data-bind="address"></span></div>
  <div><span class="label">Телефон</span><a id="tel" data-bind="phone"></a></div>
  <div><span class="label">Часы работы</span><span data-bind="hours"></span></div>
  <div><span class="label">Почта</span><a id="mail" data-bind="email"></a></div>
</footer>
<script src="script.js"></script>
</body>
</html>
